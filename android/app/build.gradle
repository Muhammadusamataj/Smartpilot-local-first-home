plugins {
    id 'com.android.application'
}

def releaseStoreFile = project.findProperty('RELEASE_STORE_FILE') ?: System.getenv('RELEASE_STORE_FILE')
// Reuse the previous local debug key if it exists; otherwise let Gradle use its locally generated debug key.
// Never bundle private signing keys in the source ZIP.
def debugStoreFile = file("../../tools/keys/debug.keystore")

android {
    namespace 'com.example.tuyalocalkey'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.tuyalocalkey'
        minSdk 23
        targetSdk 34
        versionCode 8
        versionName '1.7'
    }

    signingConfigs {
        debug {
            if (debugStoreFile.exists()) {
                storeFile debugStoreFile
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword project.findProperty('RELEASE_STORE_PASSWORD') ?: System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('RELEASE_KEY_ALIAS') ?: System.getenv('RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('RELEASE_KEY_PASSWORD') ?: System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            // Never publish with the public Android debug key.
            if (releaseStoreFile) signingConfig signingConfigs.release
        }
    }
}

tasks.register('checkReleaseSigning') {
    doLast {
        if (!releaseStoreFile) {
            throw new GradleException('Release build requires RELEASE_STORE_FILE and credentials in gradle.properties or environment.')
        }
    }
}
tasks.matching { it.name.startsWith('assembleRelease') }.configureEach { dependsOn 'checkReleaseSigning' }
