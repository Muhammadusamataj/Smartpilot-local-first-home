services:
  tuya-local-key:
    build: .
    image: mylocal-devices-tuya:local
    container_name: tuya-local-key
    ports:
      - "8000:8000"
    volumes:
      - tuya-session:/data
    environment:
      - QR_SCHEME=smartlife      # or "tuyaSmart"
      # The device list is kept in the volume, encrypted, so it survives a restart. Set to "off" to hold it in memory only.
      # - DEVICE_CACHE=off
      # - CHECK_FOR_UPDATES=false   # disable all update checks
      # Prefills "Scan network" (local IPs and protocol versions over TCP 6668). Several subnets are fine, comma-separated.
      # - LAN_SUBNET=192.168.2.0/24    # your IoT VLAN or subnet
      # Optional login. The Docker entry point refuses a non-loopback bind when these are unset.
      # Set BOTH to require a username + password (recommended when the port is reachable beyond localhost),
      # or set ALLOW_NO_AUTH=1 to accept an unauthenticated LAN bind explicitly.
      # - AUTH_USERNAME=admin
      # - AUTH_PASSWORD=change-me
      # - ALLOW_NO_AUTH=1
    restart: unless-stopped

volumes:
  tuya-session:
