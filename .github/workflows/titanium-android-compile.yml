name: Titanium Android compile-only regression

on:
  push:
    branches: [integrate/lovable-titanium-v122-staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: titanium-android-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm existing Android package identity is untouched
        run: |
          grep -q "applicationId 'com.example.tuyalocalkey.offline.v2'" android_offline/app/build.gradle
          grep -q "versionCode 22" android_offline/app/build.gradle
          grep -q "versionName '1.21'" android_offline/app/build.gradle
      - name: Compile Android debug APK (NOT a signed upgrade artifact)
        working-directory: android_offline
        run: bash ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Verify Gradle APK output exists
        run: test -s android_offline/app/build/outputs/apk/debug/app-debug.apk
      - name: Never publish a CI debug APK as an upgrade
        run: echo 'Compile-only check; generated CI debug signer is NOT the pinned production-installed certificate.'
